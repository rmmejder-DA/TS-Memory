<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setting</title>
</head>

<body class="setting__body">
    <main class="main-content">
        <section class="setting__left--content">
            <h1 class="setting__title">Settings</h1>
            <form class="game__themes">
                <label for="theme"><img src="/icon/palette.png" alt="Palette">Game themes:</label>
                <div class="game__themes__theme">
                    <input type="radio" value="light" name="theme" id="light-theme" checked>
                    <label for="light-theme">Code vibes theme</label>
                </div>
                <div class="game__themes__theme">
                    <input type="radio" value="dark" name="theme" id="dark-theme">
                    <label for="dark-theme">Da Projects theme</label>
                </div>
            </form>

            <form class="game__players">
                <label for="player"> <img src="/icon/chess_pawn.png" alt="Player">Choose player:</label>
                    <div class="game__players__player">
                        <input type="radio" value="player1" name="player" id="player1">
                        <label for="player1">Blue</label>
                    </div>
                    <div class="game__players__player">
                        <input type="radio" value="player2" name="player" id="player2">
                        <label for="player2">Orange</label>
                    </div>
            </form>

            <form class="game__board">
                <label for="board"> <img src="/icon/card.png" alt="Board">Board Size:</label>
                    <div class="game__board__size">
                        <input type="radio" value="4x4" name="board" id="16">
                        <label for="16">16</label>
                    </div>
                    <div class="game__board__size">
                        <input type="radio" value="4x6" name="board" id="24">
                        <label for="24">24</label>
                    </div>
                    <div class="game__board__size">
                        <input type="radio" value="6x6" name="board" id="36">
                        <label for="36">36</label>
                    </div>
            </form>
        </section>
        <section class="setting__right--content">
            <img id="theme-preview" src="/images/vibe-style.png" alt="Code vibes theme" class="themes-img">
            <div class="startplay__wrapper">
                <span id="themeview">Game theme</span>
                <span class="line"></span>
                <span id="playerview">Player</span>
                <span class="line"></span>
                <span id="boardview">Board size</span>

                <button id="readyplay" class="startplay__button">
                    <img class="startplay__button-icon" src="/icon/controller_small.png" alt="Stadia Controller">
                    <p class="startplay__button-text">Start</p>
                    <span class="startplay__button-arrow">&#x2192;</span>
                </button>
            </div>
        </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
