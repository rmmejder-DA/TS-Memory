<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setting</title>
</head>

<body class="setting__body">
    <main class="main-content">
        <section class="setting__left--content">
            <h1>Setting</h1>
            <form class="game__themes">
                <label for="theme">Game themes:</label>
                <div class="game__themes__theme">
                    <input type="radio" value="light" name="theme" id="light-theme">
                    <label for="light-theme">Code vibes theme</label>
                </div>
                <div class="game__themes__theme">
                    <input type="radio" value="dark" name="theme" id="dark-theme">
                    <label for="dark-theme">Da Projects theme</label>
                </div>
            </form>
            <form>
                <label for="player">Choose player:</label>
                <div class="game__players">
                    <div class="game__players__player">
                        <input type="radio" value="player1" name="player" id="player1">
                        <label for="player1">Blue</label>
                    </div>
                    <div class="game__players__player">
                        <input type="radio" value="player2" name="player" id="player2">
                        <label for="player2">Orange</label>
                    </div>
            </form>
            <form>
                <label for="board">Board Size:</label>
                <div class="game__board">
                    <div class="game__board__size">
                        <input type="radio" value="4x4" name="board" id="16">
                        <label for="16">16</label>
                    </div>
                    <div class="game__board__size">
                        <input type="radio" value="6x6" name="board" id="24">
                        <label for="24">24</label>
                    </div>
                    <div class="game__board__size">
                        <input type="radio" value="6x6" name="board" id="36">
                        <label for="36">36</label>
                    </div>
            </form>
        </section>
        <section class="setting__right--content">
            <div id="setting__preview">
                <div class="playersView">
                    <p id="blue">Blue<span id="counter">0</span></p>
                    <p id="orange">Orange<span id="counter">0</span></p>
                </div>
                <div class="current_Player" id="current_Player">
                    <p>Current Player: <span id="currentPlayer">Blue</span></p>
                </div>
                <button id="exit_game" class="exit__button"></button>
            </div>
            <div id="themes__preview">
                <img src="${themePreviewUrl}" alt="light theme" id="light-theme-preview">
            </div>
            <footer>
                <span id="themeview">Game theme</span>
                <span id="playerview">Player</span>
                <span id="boardview">Board size</span>
                <button id="readyplay" class="startplay__button"></button>
            </footer>
        </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
