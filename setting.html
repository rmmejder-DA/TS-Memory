<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setting</title>
    <link rel="icon" type="image/svg+xml" href="/icon/memory-favicon.svg">
    <script type="module" src="/src/main.ts"></script>
</head>

<body class="setting__body">
    <main class="main-content">
        <section class="setting__left--content">
            <h1 class="setting__title">Settings<div class="setting__title--line"></div></h1>

            <form class="game__themes">
                <b for="theme"><img src="/public/icon/palette.svg" alt="Palette">Game themes:</b>
                <div class="game__themes__theme">
                    <input type="radio" value="light" name="theme" id="light-theme" checked class="player-radio">
                    <label for="light-theme">Code vibes theme</label>
                </div>
                <div class="game__themes__theme">
                    <input type="radio" value="dark" name="theme" id="dark-theme" class="player-radio">
                    <label for="dark-theme">Foods theme</label>
                </div>
            </form>

            <form class="game__players">
                <b for="player"> <img src="/public/icon/chess_pawn-small.svg" alt="Player">Choose player:</b>
                <div class="game__players__player">
                    <input type="checkbox" class="player-radio" value="player1" name="player" id="player1">
                    <label for="player1">Blue</label>
                </div>
                <div class="game__players__player">
                    <input type="checkbox" class="player-radio" value="player2" name="player" id="player2">
                    <label for="player2">Orange</label>
                </div>
            </form>

            <form class="game__board">
                <b for="board"> <img src="/public/icon/card-small.svg" alt="Board">Board Size:</b>
                <div class="game__board__size">
                    <input type="radio" value="4x4" name="board" id="16" class="player-radio">
                    <label for="16">16 cards</label>
                </div>
                <div class="game__board__size">
                    <input type="radio" value="4x6" name="board" id="24" class="player-radio">
                    <label for="24">24 cards</label>
                </div>
                <div class="game__board__size">
                    <input type="radio" value="6x6" name="board" id="36" class="player-radio">
                    <label for="36">36 cards</label>
                </div>
            </form>
        </section>
        <section class="setting__right--content">
            <img id="theme-preview" src="public/images/da-style.png" alt="Code vibes theme" class="themes-img">
            <div class="startplay__wrapper">
                <span id="themeview">Game theme</span>
                <span class="line"></span>
                <span id="playerview">Player</span>
                <div id="player-preview" class="player-preview"></div>
                <span class="line"></span>
                <span id="boardview">Board size</span>

                <button onclick="window.location.href='play.html';" id="readyplay" class="startplay__button" disabled>
                    <img class="startplay__button-icon" src="/icon/smart_display-disabled.svg" alt="smart_display-disabled">
                    <p class="startplay__button-text">Start</p>
                </button>
            </div>

        </section>
    </main>
</body>

</html>
