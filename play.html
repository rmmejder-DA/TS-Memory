<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TS-Memory</title>
    <script type="module" crossorigin src="/TS-Memory/assets/play-C6wgKQ4-.js"></script>
    <link rel="modulepreload" crossorigin href="/TS-Memory/assets/main-DkmOTNHx.js">
    <link rel="stylesheet" crossorigin href="/TS-Memory/assets/main-BKOK8E0O.css">
</head>

<body>
    <header class="play__header">
        <div id="playerview">
            <img src="/public/icon/chess_pawn.png" alt="choosePlayer">
            <span id="counter">0</span>
        </div>
        <div id="currentPlayer" class="play__header__currentPlayer">
            <p>Current player</p>
            <img id="player" src="/public/icon/chess_pawn.png">
        </div>
        <button class="exitGame">
            <img src="/public/icon/move_item.png" alt="exit">
            <p class="exitGame">Exit game</p>
        </button>
    </header>
    <section id="field">
        <button class="card" type="button" aria-label="Memory card" title="Memory card">
            <div class="card__inner">
                <div class="card__face"></div>
                <div class="card__face card__face--back"></div>
            </div>
        </button>
    </section>
    <script type="module" src="./src/main.ts"></script>
</body>

</html>
